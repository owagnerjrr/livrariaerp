services:
  - type: web
    name: livrariaerp-demo-api
    runtime: docker
    plan: free
    region: virginia
    repo: https://github.com/owagnerjrr/livrariaerp
    branch: main
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: demo
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: caramelo-erp-demo
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: DEMO_DATABASE_NAME
        value: caramelo_erp
      - key: DEMO_SEED_CONFIRM
        value: caramelo_erp
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_SEED_ON_START
        value: "true"
      - key: SESSION_HOURS
        value: "4"
